name: Build Nova VS Code Extension v2.0.0 via GitHub Cloud

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install Official VSCE Compiler globally
      run: npm install -g @vscode/vsce

    - name: Compile VSIX on GitHub Cloud with Embedded Icon
      run: |
        cd 5_Nova_IDE_Extensions/vscode-nova
        
        echo "=== VERIFYING EMBEDDED ICON ==="
        ls -lh icon.png
        
        # Package directly using official vsce compiler
        vsce package --allow-missing-repository --out nova-script-v2.0.0.vsix

    - name: Upload Verified Artifact v2.0.0
      uses: actions/upload-artifact@v4
      with:
        name: Nova-VSCode-Extension-v2.0.0
        path: 5_Nova_IDE_Extensions/vscode-nova/*.vsix
