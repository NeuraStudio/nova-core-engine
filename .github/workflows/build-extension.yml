name: Build Nova Official Extensions

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install VSCE Compiler
      run: npm install -g @vscode/vsce

    - name: Build VS Code VSIX Package
      run: |
        cd 5_Nova_IDE_Extensions/vscode-nova
        # Ensure proper files exist
        echo "# Nova Script" > README.md
        echo "MIT License" > LICENSE.md
        vsce package --allow-missing-repository --out nova-script.vsix

    - name: Build PyCharm Plugin Package
      run: |
        cd 5_Nova_IDE_Extensions/pycharm-nova
        mkdir -p META-INF
        cat << 'PLUG' > META-INF/plugin.xml
        <idea-plugin>
          <id>com.neurastudio.nova</id>
          <name>Nova Script</name>
          <version>1.1.0</version>
          <vendor>NeuraStudio</vendor>
          <description>Official Nova Language Syntax and Support for PyCharm</description>
          <depends>com.intellij.modules.platform</depends>
        </idea-plugin>
        PLUG
        zip -r ../nova-pycharm-plugin.zip META-INF/ ../Nova.xml

    - name: Upload Final Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Nova-Official-Extensions
        path: |
          5_Nova_IDE_Extensions/vscode-nova/*.vsix
          5_Nova_IDE_Extensions/pycharm-nova/*.zip
