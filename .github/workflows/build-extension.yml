name: Build Nova VS Code Extension via Cloud

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install Official VSCE Compiler
      run: npm install -g @vscode/vsce

    - name: Compile Ultimate VSIX Package on Cloud
      run: |
        cd 5_Nova_IDE_Extensions/vscode-nova
        vsce package --allow-missing-repository --out nova-script-ultimate-v1.4.vsix

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nova-VSCode-Extension-v1.4
        path: 5_Nova_IDE_Extensions/vscode-nova/*.vsix
