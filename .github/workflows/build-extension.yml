name: Build Nova Ultimate VS Code Extension v2.0.0

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install Official VSCE Compiler
      run: npm install -g @vscode/vsce

    - name: Prepare Root Manifest & Compile Official VSIX
      run: |
        cd 5_Nova_IDE_Extensions/vscode-nova
        
        # Ensure icon.png is strictly present
        if [ ! -f icon.png ]; then
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > icon.png
        fi

        # Verify root manifest exists before packing
        if [ ! -f extension.vsixmanifest ]; then
          echo "ERROR: extension.vsixmanifest missing!"
          exit 1
        fi

        # Official compilation via vsce (Guarantees valid PackageManifest)
        vsce package --allow-missing-repository --out nova-script-v2.0.0.vsix

    - name: Upload Master Artifact v2.0.0
      uses: actions/upload-artifact@v4
      with:
        name: Nova-VSCode-Extension-v2.0.0
        path: 5_Nova_IDE_Extensions/vscode-nova/*.vsix
