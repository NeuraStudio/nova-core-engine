name: Build Nova VS Code Extension v1.5.0

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install Official VSCE Compiler
      run: npm install -g @vscode/vsce

    - name: Verify and Pack Ultimate VSIX v1.5.0
      run: |
        cd 5_Nova_IDE_Extensions/vscode-nova
        echo "=== CHECKING EXTENSION ASSETS ==="
        ls -la
        # Ensure icon.png is present
        if [ ! -f icon.png ]; then
          echo "WARNING: icon.png missing, creating placeholder"
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > icon.png
        fi
        vsce package --allow-missing-repository --out nova-script-v1.5.0.vsix

    - name: Upload v1.5.0 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nova-VSCode-Extension-v1.5.0
        path: 5_Nova_IDE_Extensions/vscode-nova/*.vsix
