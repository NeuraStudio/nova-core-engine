name: Build Nova VS Code Extension (Official Cloud Compiler)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install Official VSCE
      run: npm install -g @vscode/vsce

    - name: Compile Valid VSIX
      run: |
        cd 5_Nova_IDE_Extensions/vscode-nova
        # Ensure mandatory files exist
        if [ ! -f "README.md" ]; then echo "# Nova Script" > README.md; fi
        if [ ! -f "LICENSE.md" ]; then echo "MIT License" > LICENSE.md; fi
        # Let official vsce handle manifest generation and packaging
        vsce package --allow-missing-repository --out nova-script-official.vsix

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nova-Official-VSIX
        path: 5_Nova_IDE_Extensions/vscode-nova/*.vsix
