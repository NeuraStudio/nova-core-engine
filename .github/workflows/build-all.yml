name: Build Nova Ecosystem (Installers & PyCharm)

on:
  push:
    branches: [ "main" ]

jobs:
  build-pycharm:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Package PyCharm Plugin for JetBrains Marketplace
      run: |
        cd 5_Nova_IDE_Extensions
        mkdir -p pycharm-nova/META-INF
        
        # ऑरिजिनल लोगो सेट करना
        if [ -f vscode-nova/icon.png ]; then
          cp vscode-nova/icon.png pycharm-nova/META-INF/pluginIcon.png
        else
          python3 -c "from PIL import Image; img = Image.new('RGB', (128, 128), color = (0, 0, 0)); img.save('pycharm-nova/META-INF/pluginIcon.png')"
        fi
        
        # JETBRAINS MARKETPLACE FIX: Folder/lib/plugin.jar स्ट्रक्चर बनाना
        mkdir -p pycharm-build/nova-script/lib
        cd pycharm-nova
        # सारी फाइल्स को एक .jar में पैक करना
        zip -r ../pycharm-build/nova-script/lib/nova-script.jar *
        cd ../pycharm-build
        # अब उस फोल्डर को फाइनल .zip में बदलना
        zip -r ../Nova-PyCharm-Plugin-v2.0.0.zip nova-script
        
    - name: Upload PyCharm Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nova-PyCharm-Plugin-v2.0.0
        path: 5_Nova_IDE_Extensions/Nova-PyCharm-Plugin-v2.0.0.zip

  build-installers:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter Pillow

    - name: Ensure Assets Exist for Build
      run: |
        cd 7_Nova_GUI_Installer
        mkdir -p assets
        python3 -c "
from PIL import Image
import os
if not os.path.exists('assets/nova_logo.png'):
    Image.new('RGB', (200, 200), color = (15, 25, 35)).save('assets/nova_logo.png')
if not os.path.exists('assets/neura_logo.png'):
    Image.new('RGB', (120, 40), color = (15, 25, 35)).save('assets/neura_logo.png')
        "
      shell: bash

    - name: Compile OS-Specific Binary with PyInstaller
      run: |
        cd 7_Nova_GUI_Installer
        # WINDOWS PATH SEPARATOR FIX (; vs :)
        if [ "$RUNNER_OS" == "Windows" ]; then
          pyinstaller --noconsole --onefile --windowed --collect-all customtkinter --add-data "assets;assets" --name "Nova_Installer_Windows" nova_installer.py
        else
          pyinstaller --noconsole --onefile --windowed --collect-all customtkinter --add-data "assets:assets" --name "Nova_Installer_${RUNNER_OS}" nova_installer.py
        fi
      shell: bash

    - name: Upload Installer Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Nova_Installer_${{ runner.os }}
        path: 7_Nova_GUI_Installer/dist/*
