name: Build Nova GUI Installers (Win/Mac/Linux)

on:
  push:
    branches: [ "main" ]

jobs:
  build-installers:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter Pillow

    - name: Ensure Assets Exist (Cross-Platform Python Way)
      run: |
        python -c "
        import os
        from PIL import Image
        os.makedirs('7_Nova_GUI_Installer/assets', exist_ok=True)
        if not os.path.exists('7_Nova_GUI_Installer/assets/nova_logo.png'):
            Image.new('RGB', (200, 200), (15, 25, 35)).save('7_Nova_GUI_Installer/assets/nova_logo.png')
        if not os.path.exists('7_Nova_GUI_Installer/assets/neura_logo.png'):
            Image.new('RGB', (120, 40), (15, 25, 35)).save('7_Nova_GUI_Installer/assets/neura_logo.png')
        "

    - name: Compile on Windows
      if: runner.os == 'Windows'
      run: |
        cd 7_Nova_GUI_Installer
        pyinstaller --noconsole --onefile --windowed --collect-all customtkinter --add-data "assets;assets" --name "Nova_Installer_Windows" nova_installer.py

    - name: Compile on Mac & Linux
      if: runner.os != 'Windows'
      run: |
        cd 7_Nova_GUI_Installer
        pyinstaller --noconsole --onefile --windowed --collect-all customtkinter --add-data "assets:assets" --name "Nova_Installer_${{ runner.os }}" nova_installer.py

    - name: Upload Installer Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Nova_Installer_${{ runner.os }}
        path: 7_Nova_GUI_Installer/dist/*
