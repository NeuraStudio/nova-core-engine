name: Build Nova Installers (Win/Mac/Linux)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Build Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter Pillow

    - name: Ensure Assets Exist for Build
      run: |
        cd 7_Nova_GUI_Installer
        mkdir -p assets
        # Fallback dummy image if png is missing so PyInstaller never fails
        if [ ! -f assets/nova_logo.png ]; then
          python3 -c "from PIL import Image; img = Image.new('RGB', (200, 200), color = (15, 25, 35)); img.save('assets/nova_logo.png')"
        fi
        if [ ! -f assets/neura_logo.png ]; then
          python3 -c "from PIL import Image; img = Image.new('RGB', (120, 40), color = (15, 25, 35)); img.save('assets/neura_logo.png')"
        fi

    - name: Compile OS-Specific Binary with PyInstaller
      run: |
        cd 7_Nova_GUI_Installer
        pyinstaller --noconsole --onefile --windowed --add-data "assets:assets" --name "Nova_Installer_${{ runner.os }}" nova_installer.py

    - name: Upload Installer Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Nova_Installer_${{ runner.os }}
        path: 7_Nova_GUI_Installer/dist/*
